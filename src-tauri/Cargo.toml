[package]
name = "agentguard-desktop"
version = "0.1.0"
description = "AgentGuard — local reviewer for AI-generated code changes: leaked secrets, security regressions, broken tests and suspicious edits."
authors = ["AgentGuard contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Manixpcshot/agentguard-desktop"
readme = "../README.md"

[lib]
name = "agentguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
regex = "1"
globset = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
unicode-normalization = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 0
