name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  catalog:
    name: Rules catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate catalog
        run: python3 tools/gen_rules.py
      - name: Validate catalog
        run: python3 tools/check_rules.py
      - name: Ensure committed catalog is up to date
        run: |
          if ! git diff --quiet -- src-tauri/resources/rules.json; then
            echo "::error::rules.json is stale - run tools/gen_rules.py and commit"
            git diff -- src-tauri/resources/rules.json | head -40
            exit 1
          fi

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job: test
          - os: windows-latest
            job: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Linux dependencies (webkit2gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: cargo check
        id: check
        working-directory: src-tauri
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --all-targets --color never 2>&1 | tee ../ci-check.log
      - name: Publish compile log (debug aid, on failure only)
        if: steps.check.outcome == 'failure' && github.event_name == 'push'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
        run: |
          mkdir -p ci-logs
          tail -n 5000 ci-check.log > "ci-logs/$OS.log"
          {
            grep -nE '^(error|warning)(\[|:)' -A 14 ci-check.log | tail -n 2000 || true
          } > "ci-logs/$OS-summary.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add ci-logs
          git commit -m "ci: publish cargo check log for $OS [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then echo "log pushed"; break; fi
            sleep 15
          done
      - name: Fail if cargo check failed
        if: steps.check.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: cargo test
        if: matrix.job == 'test' && steps.check.outcome == 'success'
        working-directory: src-tauri
        shell: bash
        run: cargo test 2>&1 | tee ../ci-test.log
      - name: Publish test log (debug aid, on failure only)
        if: failure() && matrix.job == 'test' && steps.check.outcome == 'success' && github.event_name == 'push'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
        run: |
          mkdir -p ci-logs
          tail -n 5000 ci-test.log > "ci-logs/$OS-test.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add ci-logs
          git commit -m "ci: publish cargo test log for $OS [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then echo "log pushed"; break; fi
            sleep 15
          done
      - name: cargo clippy (advisory)
        if: matrix.job == 'test' && steps.check.outcome == 'success'
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Upload Cargo.lock
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
