name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installer + executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles (NSIS installer + MSI + exe)
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Get-ChildItem -Recurse src-tauri/target/x86_64-pc-windows-msvc/release/bundle |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { Copy-Item $_.FullName dist-release/ }
          Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/AgentGuard.exe |
            ForEach-Object { Copy-Item $_.FullName dist-release/AgentGuard-portable.exe }
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.exe
            dist-release/*.msi
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
